# =============================================
# Pet Chef Ver B1.00 — Docker Compose 测试环境
# =============================================
# 与生产环境的区别：
#   1. 源码通过 volume 挂载（实时修改，无需重建镜像）
#   2. node_modules 来自预装镜像（启动秒级）
#   3. Frontend 使用 Vite dev server（热更新）
#   4. 无 Nginx（开发不需要反向代理）
#
# 启动：docker compose -f docker-compose.test.yml up -d
# 销毁：docker compose -f docker-compose.test.yml down -v
# =============================================

services:
  test-backend:
    image: petchef-test-env:b1.00
    container_name: petchef-test-backend
    restart: "no"
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
      - SMS_VERIFICATION_SECRET=${SMS_VERIFICATION_SECRET:-}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_ENDPOINT=${ALIYUN_SMS_ENDPOINT:-dysmsapi.aliyuncs.com}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-}
      - TERMS_VERSION=${TERMS_VERSION:-2026-07-31}
      - PRIVACY_VERSION=${PRIVACY_VERSION:-2026-07-31}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - TUYA_ACCESS_ID=${TUYA_ACCESS_ID:-}
      - TUYA_SECRET=${TUYA_SECRET:-}
      - TUYA_DEVICE_ID=${TUYA_DEVICE_ID:-}
      - TUYA_BASE_URL=${TUYA_BASE_URL:-https://openapi.tuyacn.com}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      # 只挂载源码目录（node_modules 使用镜像内预装的）
      - ./backend/src:/app/backend/src:ro
      - ./backend/data:/app/backend/data:ro
      # 可写目录（日志、临时文件）
      - backend-logs:/app/backend/logs
    command: ["node", "backend/src/index.js"]
    working_dir: /app
    networks:
      - petchef-test-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/breeds"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  test-frontend:
    image: petchef-test-env:b1.00
    container_name: petchef-test-frontend
    restart: "no"
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE=http://localhost:3001
      - VITE_CACHE_DIR=/tmp/.vite
    volumes:
      # 前端源码挂载（Vite 需要在配置文件目录写 .timestamp 文件）
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.js:/app/frontend/vite.config.js
    command: ["sh", "-c", "cd /app/frontend && npx vite --host 0.0.0.0 --port 5174"]
    working_dir: /app/frontend
    depends_on:
      test-backend:
        condition: service_healthy
    networks:
      - petchef-test-net
    security_opt:
      - no-new-privileges:true
    # Vite dev server 需要写 .timestamp 和缓存文件，不用 read_only
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5174"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  backend-logs:

networks:
  petchef-test-net:
    driver: bridge
