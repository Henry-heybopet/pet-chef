apply plugin: 'com.android.application'

def tuyaProperties = new Properties()
def tuyaPropertiesFile = rootProject.file("tuya.properties")
if (tuyaPropertiesFile.exists()) {
    tuyaPropertiesFile.withInputStream { tuyaProperties.load(it) }
}

def readSecret = { key ->
    return tuyaProperties.getProperty(key, System.getenv(key) ?: "")
}

def escapeBuildConfig = { value ->
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

def releaseStoreFilePath = System.getenv("ANDROID_RELEASE_STORE_FILE") ?: ""
def releaseStorePassword = System.getenv("ANDROID_RELEASE_STORE_PASSWORD") ?: ""
def releaseKeyAlias = System.getenv("ANDROID_RELEASE_KEY_ALIAS") ?: ""
def releaseKeyPassword = System.getenv("ANDROID_RELEASE_KEY_PASSWORD") ?: ""
def releaseSigningReady = [releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { !it.isEmpty() }

android {
    namespace = "com.heybopet.petchef"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.heybopet.petchef"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "TUYA_ANDROID_APP_KEY", "\"${escapeBuildConfig(readSecret('TUYA_ANDROID_APP_KEY'))}\""
        buildConfigField "String", "TUYA_ANDROID_APP_SECRET", "\"${escapeBuildConfig(readSecret('TUYA_ANDROID_APP_SECRET'))}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.alibaba:fastjson:1.1.67.android'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.14.9'
    implementation('com.thingclips.smart:thingsmart:7.5.6') {
        exclude group: 'com.thingclips.smart', module: 'thingsmart-modularCampAnno'
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !releaseSigningReady) {
        throw new GradleException("Release signing is required. Set ANDROID_RELEASE_STORE_FILE, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS and ANDROID_RELEASE_KEY_PASSWORD.")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
