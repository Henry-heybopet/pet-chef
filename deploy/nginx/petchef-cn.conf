server {
    listen 80;
    listen [::]:80;
    server_name heybopet.cn www.heybopet.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://petchef.heybopet.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name petchef.heybopet.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://petchef.heybopet.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name heybopet.cn www.heybopet.cn;

    ssl_certificate /etc/letsencrypt/live/heybopet.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heybopet.cn/privkey.pem;

    return 301 https://petchef.heybopet.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name petchef.heybopet.cn;

    ssl_certificate /etc/letsencrypt/live/heybopet.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heybopet.cn/privkey.pem;

    client_max_body_size 6m;
    root /opt/petchef/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /opt/petchef/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # The Admin SPA entry must always be revalidated. Its hashed JS/CSS files
    # remain cacheable, but stale index.html must never pin an old UI release.
    location = /admin/index.html {
        alias /opt/petchef/admin/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
