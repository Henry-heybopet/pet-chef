# Pet Chef Ver B1.00 — Secure Docker Compose
# Run: docker compose up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: petchef-backend:b1.00
    container_name: petchef-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
      - SMS_VERIFICATION_SECRET=${SMS_VERIFICATION_SECRET:-}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_ENDPOINT=${ALIYUN_SMS_ENDPOINT:-dysmsapi.aliyuncs.com}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-}
      - TERMS_VERSION=${TERMS_VERSION:-2026-07-31}
      - PRIVACY_VERSION=${PRIVACY_VERSION:-2026-07-31}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - TUYA_ACCESS_ID=${TUYA_ACCESS_ID:-}
      - TUYA_SECRET=${TUYA_SECRET:-}
      - TUYA_DEVICE_ID=${TUYA_DEVICE_ID:-}
      - TUYA_BASE_URL=${TUYA_BASE_URL:-https://openapi.tuyacn.com}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://petchef:petchef_secure_pass@db:5432/petchef?schema=public}
      - ADMIN_SUPER_USERNAME=${ADMIN_SUPER_USERNAME:-}
      - ADMIN_SUPER_PASSWORD=${ADMIN_SUPER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.data:/app/.data
      - ./uploads:/app/public/uploads
    networks:
      - petchef-net
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: petchef-nginx:b1.00
    container_name: petchef-nginx
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - petchef-net
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: petchef-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=petchef
      - POSTGRES_PASSWORD=petchef_secure_pass
      - POSTGRES_DB=petchef
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - petchef-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petchef -d petchef"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  petchef-net:
    driver: bridge
    internal: false
